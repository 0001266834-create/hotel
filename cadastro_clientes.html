<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Cadastro de clientes </title>
    <link rel="stylesheet" href="css/estilo.css">
    <style>
    
    body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9; /* Fundo claro para contrastar com o cartão */
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Cartão Central que organiza todo o conteúdo */
        .container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            padding: 40px;
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        /* Título Principal */
        h1 {
            color: #4a3e3d; /* Tom escuro elegante */
            font-size: 2.2rem;
            margin-top: 0;
            margin-bottom: 5px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Subtítulo */
        h2 {
            color: #666;
            font-size: 1.4rem;
            font-weight: 400;
            margin-top: 0;
            margin-bottom: 30px;
        }

        /* Grupos de Formulário (Organiza label + input em blocos) */
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        /* Rótulos dos campos */
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #4a3e3d;
            font-size: 0.95rem;
        }

        /* Customização das Caixas de Entrada */
        input[type="text"], 
        input[type="email"], 
        input[type="tel"], 
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #dcdcdc;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.3s, box-shadow 0.3s;
            box-sizing: border-box;
            background-color: #fff;
        }

        /* Efeito ao clicar no campo */
        input:focus {
            border-color: #c5a059; /* Dourado imperial */
            box-shadow: 0 0 0 3px rgba(197, 160, 89, 0.2);
            outline: none;
        }

        /* Botão Enviar */
        button {
            background: linear-gradient(135deg, #c5a059, #b38f46); /* Degradê dourado */
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 14px;
            width: 100%;
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            margin-top: 15px;
            box-shadow: 0 4px 12px rgba(197, 160, 89, 0.3);
        }

        /* Efeitos de passar o mouse e clicar no botão */
        button:hover {
            opacity: 0.9;
        }

        button:active {
            transform: scale(0.98);
        }

        /* Link para a página de Login */
        .login-link {
            display: inline-block;
            margin-top: 25px;
            color: #8c7e7d;
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.2s;
            border-bottom: 1px solid #dcdcdc;
            padding-bottom: 2px;
        }

        .login-link:hover {
            color: #4a3e3d;
            border-bottom-color: #4a3e3d;
        }
</style>

</head>
<body>

<div class="container">

    <h1>Imperial Palace</h1> 
    <h2>Cadastro de Cliente</h2>

    <form action="salvar_cliente.php" method="POST">
        
             <div class="form-group">
        <label for="nome">Nome Completo:</label>
        <input type="text" id="nome" name="nome" required>
         </div>

          <div class="form-group">
        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required>
        </div>

          <div class="form-group">
        <label for="telefone">Telefone:</label>
        <input type="tel" id="telefone" name="telefone">
         </div>

         <div class="form-group">
        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" required>
        </div>


        <button type="submit">Enviar</button>

        </form>

    

    <a href="login.html" class="login-link">Já tem uma conta? Faça login</a>

    </div>
</body>
</html>
